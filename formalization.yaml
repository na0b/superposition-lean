version: "v0.4"

project:
  name: "Superposition in disjoint variables for the infinity Laplace equation"
  description: >-
    A complete Lean 4 / Mathlib formalization of the three main theorems of Liu, Manfredi and Zhou,
    "Superposition property in disjoint variables for the infinity Laplace equation" (RIMS
    Kôkyûroku Bessatsu B99 (2026); arXiv:2508.17106). If u is a viscosity subsolution
    (resp. supersolution, solution) of -Δ∞u = f in a domain U ⊆ ℝⁿ and v one of -Δ∞v = g in a
    domain V ⊆ ℝᵐ, with f and g continuous, then w(x, y) = u(x) + v(y) is a viscosity subsolution
    (resp. supersolution, solution) of -Δ∞w = f(x) + g(y) in U × V. For a continuous, degenerate
    elliptic and sub-additive operator L, the sum of viscosity subsolutions of L(∇u, ∇²u) = f and
    L(∇v, ∇²v) = g is a subsolution of L(∇w, ∇²w) = f + g. On proper geodesic metric spaces, the
    disjoint sum of functions satisfying comparison with cones (from above, below, or both)
    satisfies comparison with cones on the product with the sum metric d_X + d_Y. Mathlib lacks
    the Crandall–Ishii–Lions theorem on sums, so its ingredients (sup-convolution, Alexandrov's
    theorem, Jensen's lemma) are formalized along the way; there is no sorry and no axiom beyond
    propext, Classical.choice and Quot.sound.
  authors:
    - "Qing Liu"
    - "Juan J. Manfredi"
    - "Xiaodan Zhou"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan J. Manfredi"

classification:
  arxiv: [math.AP, math.MG]
  msc2020: [35J94, 35D40, 35J70, 30L99, 68V20]

