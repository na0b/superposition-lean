related_formalizations: []

status:
  scope: >-
    Formalized in full, with everything their proofs use: Theorem "Superposition in disjoint
    variables for the infinity Laplacian" (subsolution, supersolution and solution cases),
    Theorem "Subsolutions of sub-additive equations", and Theorem "Superposition for comparison
    with cones" (from above, from below, from both sides). Not formalized: Proposition
    "Superposition for Laplacian", Proposition "Subsolutions of convex equations", and the
    paper's remarks.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
