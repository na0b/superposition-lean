      cost:
        wall_time: "about 7.5 hours (2026-09-19), 49 cycles"
        spend_usd: "subscription-based"
        hardware: "local machine (Linux workstation) plus subscription model access"
      prompting_notes: "Standard Trellis prompts; the input was the paper's LaTeX source and the choice of target theorems."
    - method: agent
      models: ["Claude Opus 5 (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        Export from the Trellis workspace to this repository, the port to Lean v4.35.0-rc2 and
        the module system, and the Challenge/Solution/Comparator packaging for Palomar, done by
        Claude Code under the maintainer's direction.
      cost:
        wall_time: "a few hours"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: >-
    The Lean proofs and the blueprint were written by AI agents under the Trellis protocol.
    Juan J. Manfredi chose the targets, supervised the run and approved the phase gates; he is
    responsible for the repository.

fidelity:
  divergences: >-
    No deviation from the paper was authorized during the run. Representation choices: functions
    are total on the ambient space and only their values on the domain enter; viscosity
    sub/supersolutions use C² test functions on the domain and local extrema; ellipticity and
    sub-additivity are imposed on symmetric matrices; 𝒪 ⊂⊂ Ω in comparison with cones is
    expressed as 𝒪 open and bounded with compact closure contained in Ω; the product metric d₁ is
    Mathlib's WithLp 1 (X × Y); ℝⁿ × ℝᵐ is modelled as ℝⁿ⁺ᵐ with coordinate projections. The
    Euclidean theorems are proved from formalized ingredients of the Crandall–Ishii–Lions theorem
    on sums (sup-convolution, Alexandrov's theorem, Jensen's lemma) rather than from that theorem
    as a black box. The proof of the cone-comparison theorem does not use some of the stated
    hypotheses (geodesic, connectedness, U ≠ X, V ≠ Y); they are kept to match the paper.

