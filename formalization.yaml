    - "Xiaodan Zhou"
    - "Trellis verifier agents (soundness, paper-faithfulness and statement-correspondence checks on every node)"
  notes: >-
    Qing Liu, Juan J. Manfredi and Xiaodan Zhou, the authors of the paper, read Challenge.lean (the
    definitions and the seven theorem statements) against the paper (2026-11-17). In addition,
    every node passed Trellis's automated soundness, paper-faithfulness and Lean/natural-language
    correspondence reviews. The proofs were not reviewed line by line by a human; they are checked
    by the Lean kernel and by Comparator.

